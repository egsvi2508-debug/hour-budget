<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hour Budget</title>
<meta name="description" content="Give every goal an hour budget and watch it count down.">
<meta name="theme-color" content="#23604F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --ink:#15201C; --muted:#5B6862; --line:#D5DCD8;
  --accent:#23604F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --run:#B4530F; --run-soft:#FBE7D6; --track:#E3E8E5; --danger:#A6322B;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101614; --surface:#18201D; --ink:#E6EDEA; --muted:#93A29B; --line:#2A3531;
    --accent:#5FB89C; --accent-ink:#0C1512; --accent-soft:#1F3A31;
    --run:#F0955A; --run-soft:#3A2518; --track:#25302C; --danger:#E0746C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em}
.hright{display:flex;align-items:center;gap:14px}
.week{text-align:right}
.week .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.week .val{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.iconbtn{min-height:40px;min-width:40px;padding:0;display:grid;place-items:center;font-size:20px;line-height:1}
.note{font-size:13px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:14px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.goal.running{border-color:var(--run);box-shadow:0 0 0 3px var(--run-soft)}
.goal.done-goal .big{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-family:var(--display);font-weight:500;font-size:19px;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.mode{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;line-height:1;letter-spacing:-.02em}
.big small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.goal.running .bar i{background:var(--run)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pace{color:var(--ink)}
.pace.late{color:var(--danger)}
.live{font-family:var(--mono);font-size:14px;color:var(--run);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;min-height:42px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;flex:1;min-width:140px}
button.stop{background:var(--run);border-color:var(--run);color:#fff}
button.ghost{color:var(--muted)}
button.danger{color:var(--danger);border-color:var(--danger)}
button[disabled]{opacity:.5;cursor:default}
.panel{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
input.num{width:72px;font-family:var(--mono)}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.log li b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.log li b.neg{color:var(--danger)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field input{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-size:13px;min-height:34px;padding:5px 12px;border-radius:99px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}.big{font-size:30px}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.empty p{margin:0;color:var(--muted);max-width:36ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.install{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:0}
.folder:hover{border-color:var(--accent)}
.folder .ficon{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.folder .ficon svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2}
.folder .fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.folder .fname{font-family:var(--display);font-weight:500;font-size:18px;overflow-wrap:anywhere}
.folder .fmeta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.folder .frun{font-family:var(--mono);font-size:13px;color:var(--run);font-variant-numeric:tabular-nums}
.folder.hasrun{border-color:var(--run);box-shadow:0 0 0 3px var(--run-soft)}
.folder .chev{color:var(--muted);font-size:22px;flex:none}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.section-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 -4px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .primary{flex:1}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hour Budget</h1>
    <div class="hright">
      <div class="week"><div class="lbl">Last 7 days</div><div class="val" id="weekTotal">0h 00m</div></div>
      <button type="button" class="iconbtn ghost" id="menuBtn" aria-label="Settings and backup" aria-expanded="false">⋯</button>
    </div>
  </header>

  <div class="install" id="installBar" hidden>
    <span>Install Hour Budget on your home screen.</span>
    <button type="button" class="primary" id="installBtn" style="flex:0">Install</button>
  </div>

  <section class="sheet" id="menu" hidden>
    <h2>Backup</h2>
    <p class="note">Your goals live on this device only. Save a backup file now and then, and use it to move your data to a new phone.</p>
    <div class="row">
      <button type="button" id="exportBtn">Save backup file</button>
      <button type="button" id="importBtn">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="row" id="importConfirm" hidden>
      <span class="note" id="importText"></span>
      <button type="button" class="danger" id="importYes">Replace my goals</button>
      <button type="button" class="ghost" id="importNo">Cancel</button>
    </div>
  </section>

  <!-- folder header (only inside a folder) -->
  <div class="crumb" id="crumb" hidden>
    <button type="button" class="ghost" id="backBtn" aria-label="Back to all">‹ All</button>
    <h2 id="folderTitle"></h2>
    <button type="button" class="ghost" id="folderEditBtn">Rename / delete</button>
  </div>
  <p class="note" id="folderStats" hidden></p>

  <section class="sheet" id="folderForm" hidden>
    <h2 id="folderFormTitle">New folder</h2>
    <label class="field"><span>Folder name</span><input id="folderName" maxlength="60" placeholder="Maths" autocomplete="off"></label>
    <div class="row">
      <button type="button" class="primary" id="folderSave">Save folder</button>
      <button type="button" class="ghost" id="folderCancel">Cancel</button>
    </div>
    <div class="row" id="folderDeleteRow" hidden>
      <button type="button" class="ghost" id="folderDelete">Delete folder…</button>
      <span class="note" id="folderDeleteNote" hidden>Its goals stay and move to the main list.</span>
      <button type="button" class="danger" id="folderDeleteYes" hidden>Delete folder</button>
    </div>
  </section>

  <div class="btnrow" id="addRow">
    <button id="addBtn" class="primary" type="button">+ New goal</button>
    <button id="addFolderBtn" type="button">+ New folder</button>
  </div>

  <form class="sheet" id="form" hidden novalidate>
    <h2 id="formTitle">New goal</h2>
    <div class="chips" id="chips" aria-label="Quick start">
      <button type="button" data-t="Exam prep|down|100">Exam prep · 100 h</button>
      <button type="button" data-t="New piece|down|30">New piece · 30 h</button>
      <button type="button" data-t="Reading|up|">Reading · tally</button>
    </div>
    <label class="field"><span>Name</span><input id="fName" maxlength="80" placeholder="Analysis 1" autocomplete="off"></label>
    <label class="field"><span>Folder</span><select id="fFolder"></select></label>
    <label class="field" id="fNewFolderWrap" hidden><span>New folder name</span><input id="fNewFolder" maxlength="60" placeholder="Maths" autocomplete="off"></label>
    <div class="field"><span>Direction</span>
      <div class="seg" role="group" aria-label="Direction">
        <button type="button" id="mDown" aria-pressed="true">Count down</button>
        <button type="button" id="mUp" aria-pressed="false">Count up</button>
      </div>
    </div>
    <div class="two">
      <label class="field"><span id="hLabel">Hour budget</span><input id="fHours" type="number" min="0" step="0.5" inputmode="decimal" placeholder="100"></label>
      <label class="field"><span>Deadline (optional)</span><input id="fDate" type="date"></label>
    </div>
    <div class="row">
      <button type="submit" class="primary" id="saveBtn">Save goal</button>
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
    </div>
  </form>

  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
const H = 3600000, DAY = 86400000, KEY = "hourbudget.v1";
const $ = id => document.getElementById(id);
const FOLDER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
let state = load();
let current = folderFromHash();   // null = home, else folder id
let openPanel = null, confirmDelete = null, editingId = null, formMode = "down", pendingImport = null, editingFolder = null;

/* ---------- storage ---------- */
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.goals){ s.folders = s.folders || {}; return s; } } catch(e){}
  return {goals:{}, folders:{}};
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch(e){ toast("Couldn't save on this device. Free up storage and try again."); return false; }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
function newId(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- navigation ---------- */
function folderFromHash(){
  const m = location.hash.match(/^#f-([A-Za-z0-9]+)$/);
  return m ? m[1] : null;
}
function go(fid){
  if (fid) location.hash = "f-" + fid;
  else history.replaceState(null, "", location.pathname + location.search), onNav();
}
function onNav(){
  current = folderFromHash();
  if (current && !state.folders[current]) current = null;
  openPanel = null; confirmDelete = null;
  closeForm(); closeFolderForm();
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", onNav);

/* ---------- formatting ---------- */
function hm(ms){
  const neg = ms < 0; ms = Math.abs(ms);
  const m = Math.floor(ms/60000), h = Math.floor(m/60), mm = m%60;
  return (neg?"−":"") + h + "h " + String(mm).padStart(2,"0") + "m";
}
function clock(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s/60)%60, ss = s%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
}
function dateLabel(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined});
}
function when(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}) + " · " + d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- derived ---------- */
function goalsIn(fid){
  return Object.entries(state.goals).map(([id,g])=>({id,...g}))
    .filter(g => fid ? g.folderId===fid : !(g.folderId && state.folders[g.folderId]))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
function allGoals(){ return Object.entries(state.goals).map(([id,g])=>({id,...g})); }
function folders(){ return Object.entries(state.folders).map(([id,f])=>({id,...f})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); }
function doneNow(g){ return (g.doneMs||0) + (g.runningSince ? Date.now()-g.runningSince : 0); }
function weekOf(goals){
  const now = Date.now(); let w = 0;
  goals.forEach(g=>{ (g.log||[]).forEach(e=>{ if(now-e.at<7*DAY) w+=e.ms; }); if(g.runningSince) w+=now-g.runningSince; });
  return Math.max(0,w);
}

/* ---------- render ---------- */
function render(){
  $("weekTotal").textContent = hm(weekOf(allGoals()));
  const running = allGoals().find(g=>g.runningSince);
  document.title = running ? "● " + clock(Date.now()-running.runningSince) + " · " + running.name : "Hour Budget";

  const inFolder = !!current;
  $("crumb").hidden = !inFolder; $("folderStats").hidden = !inFolder;
  $("addFolderBtn").hidden = inFolder;
  $("addBtn").textContent = inFolder ? "+ New goal in " + state.folders[current].name : "+ New goal";

  if (inFolder){
    const gs = goalsIn(current);
    $("folderTitle").textContent = state.folders[current].name;
    const total = gs.reduce((s,g)=>s+doneNow(g),0);
    $("folderStats").textContent = gs.length + (gs.length===1?" goal":" goals") + " · " + hm(total) + " logged · " + hm(weekOf(gs)) + " in the last 7 days";
    $("list").innerHTML = gs.length ? gs.map(cardHTML).join("")
      : `<div class="empty"><h2>This folder is empty</h2><p>Tap “New goal” to add the first goal to ${esc(state.folders[current].name)}.</p></div>`;
    return;
  }

  const fs = folders(), loose = goalsIn(null);
  if (!fs.length && !loose.length){
    $("list").innerHTML = `<div class="empty"><h2>Give your time a budget</h2><p>Make folders like “Maths” or “Piano”, put goals inside like “Analysis 1 · 100 hours”, and start the timer while you work.</p></div>`;
    return;
  }
  let html = "";
  if (fs.length){
    html += `<p class="section-lbl">Folders</p>` + fs.map(folderHTML).join("");
  }
  if (loose.length){
    if (fs.length) html += `<p class="section-lbl">Other goals</p>`;
    html += loose.map(cardHTML).join("");
  }
  $("list").innerHTML = html;
}

function folderHTML(f){
  const gs = goalsIn(f.id);
  const total = gs.reduce((s,g)=>s+doneNow(g),0);
  const run = gs.find(g=>g.runningSince);
  return `<button type="button" class="folder${run?" hasrun":""}" data-folder="${f.id}">
    <span class="ficon">${FOLDER_SVG}</span>
    <span class="fbody">
      <span class="fname">${esc(f.name)}</span>
      <span class="fmeta">${gs.length} ${gs.length===1?"goal":"goals"} · ${hm(total)} logged</span>
      ${run?`<span class="frun" data-frun="${f.id}">● ${esc(run.name)} · ${clock(Date.now()-run.runningSince)}</span>`:""}
    </span>
    <span class="chev" aria-hidden="true">›</span>
  </button>`;
}

function cardHTML(g){
  const done = doneNow(g), target = g.targetH ? g.targetH*H : 0, down = g.mode==="down", running = !!g.runningSince;
  let big, sub, pct = null, finished = false;
  if (down){
    const rem = Math.ceil(Math.max(0,target-done)/60000)*60000; finished = rem===0;
    big = hm(rem); sub = finished ? "budget reached" : "left of " + g.targetH + " h";
    pct = target ? Math.min(100,done/target*100) : 0;
  } else {
    big = hm(done); sub = target ? "of " + g.targetH + " h" : "logged";
    if (target){ pct = Math.min(100,done/target*100); finished = done>=target; }
  }
  let paceTxt = "", late = false;
  if (g.deadline){
    const end = new Date(g.deadline+"T23:59:59").getTime();
    const daysLeft = Math.ceil((end-Date.now())/DAY);
    const remH = target ? Math.max(0,target-done)/H : null;
    if (daysLeft < 0){ paceTxt = "Deadline passed (" + dateLabel(g.deadline) + ")"; late = remH!==0; }
    else if (remH===null) paceTxt = daysLeft + " days left · until " + dateLabel(g.deadline);
    else if (remH===0) paceTxt = "Reached before " + dateLabel(g.deadline);
    else { const pd = remH/Math.max(1,daysLeft); paceTxt = "≈ " + (pd<10?pd.toFixed(1):Math.round(pd)) + " h/day · " + daysLeft + " days to " + dateLabel(g.deadline); late = pd>8; }
  }
  const open = openPanel===g.id, recent = (g.log||[]).slice(-5).reverse();
  return `<article class="goal${running?" running":""}${finished?" done-goal":""}" data-id="${g.id}">
    <div class="top"><h3 class="name">${esc(g.name)}</h3><span class="mode">${down?"Countdown":"Tally"}</span></div>
    <div class="big">${big}<small>${sub}</small></div>
    ${pct!==null?`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}
    <div class="meta">${paceTxt?`<span class="pace${late?" late":""}">${paceTxt}</span>`:`<span>${hm(done)} total</span>`}${running?`<span class="live" data-live="${g.id}">● ${clock(Date.now()-g.runningSince)}</span>`:""}</div>
    <div class="actions">
      ${running?`<button type="button" class="primary stop" data-act="stop">Stop · save session</button>`:`<button type="button" class="primary" data-act="start">Start timer</button>`}
      <button type="button" data-act="toggle" aria-expanded="${open}">${open?"Close":"Log / edit"}</button>
    </div>
    ${open?`<div class="panel">
      <div class="row"><label for="h-${g.id}">Worked without the timer:</label>
        <input class="num" id="h-${g.id}" type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="hours"><span class="note">h</span>
        <input class="num" id="m-${g.id}" type="number" min="0" max="59" step="5" inputmode="numeric" placeholder="0" aria-label="minutes"><span class="note">min</span></div>
      <div class="row"><button type="button" data-act="add">+ Add time</button><button type="button" class="ghost" data-act="sub">− Remove time</button></div>
      ${recent.length?`<div><p class="note" style="margin-bottom:6px">Recent sessions</p><ul class="log">${recent.map(e=>`<li><span>${when(e.at)}${e.src==="manual"?" · manual":""}</span><b class="${e.ms<0?"neg":""}">${e.ms<0?"":"+"}${hm(e.ms)}</b></li>`).join("")}</ul></div>`:""}
      <div class="row"><button type="button" class="ghost" data-act="edit">Edit / move</button>
        ${confirmDelete===g.id?`<button type="button" class="danger" data-act="delete-yes">Delete for good</button><button type="button" class="ghost" data-act="delete-no">Keep</button>`:`<button type="button" class="ghost" data-act="delete">Delete…</button>`}</div>
    </div>`:""}
  </article>`;
}

setInterval(()=>{
  const r = allGoals().find(g=>g.runningSince); if (!r) return;
  const t = clock(Date.now()-r.runningSince);
  const el = document.querySelector(`[data-live="${r.id}"]`); if (el) el.textContent = "● " + t;
  if (r.folderId){ const fe = document.querySelector(`[data-frun="${r.folderId}"]`); if (fe) fe.textContent = "● " + r.name + " · " + t; }
  document.title = "● " + t + " · " + r.name;
  if (Math.floor(Date.now()/1000)%30===0 && !openPanel && $("form").hidden) render();
},1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ state = load(); render(); wake(); } });

/* ---------- wake lock while timing ---------- */
let lock = null;
async function wake(){
  const running = allGoals().some(g=>g.runningSince);
  try{
    if (running && !lock && "wakeLock" in navigator){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null); }
    else if (!running && lock){ await lock.release(); lock = null; }
  }catch(e){ lock = null; }
}

/* ---------- goal actions ---------- */
function pushLog(g,ms,src){ return (g.log||[]).concat([{at:Date.now(),ms,src}]).slice(-500); }
function stopGoal(id){
  const g = state.goals[id]; if (!g || !g.runningSince) return 0;
  const ms = Date.now()-g.runningSince;
  g.doneMs = (g.doneMs||0)+ms; g.runningSince = null;
  if (ms >= 60000) g.log = pushLog(g,ms,"timer");
  return ms;
}
$("list").addEventListener("click", ev=>{
  const fb = ev.target.closest("button[data-folder]");
  if (fb){ go(fb.dataset.folder); return; }
  const btn = ev.target.closest("button[data-act]"); if(!btn) return;
  const id = btn.closest(".goal").dataset.id, g = state.goals[id]; if(!g) return;
  const act = btn.dataset.act;
  if (act==="toggle"){ openPanel = openPanel===id?null:id; confirmDelete=null; return render(); }
  if (act==="delete"){ confirmDelete=id; return render(); }
  if (act==="delete-no"){ confirmDelete=null; return render(); }
  if (act==="edit") return openForm(id);
  if (act==="start"){
    Object.keys(state.goals).forEach(k=>{ if(k!==id) stopGoal(k); });
    g.runningSince = Date.now();
  } else if (act==="stop"){
    const ms = stopGoal(id);
    toast(ms>=60000 ? "Saved " + hm(ms) + " to " + g.name : "Under a minute, not logged");
  } else if (act==="add"||act==="sub"){
    const h = parseFloat($("h-"+id).value)||0, m = parseFloat($("m-"+id).value)||0;
    let ms = Math.round((h*60+m)*60000);
    if (ms<=0) return toast("Enter hours or minutes first.");
    if (act==="sub"){ ms = -Math.min(ms,g.doneMs||0); if(ms===0) return toast("Nothing to remove yet."); }
    g.doneMs = Math.max(0,(g.doneMs||0)+ms); g.log = pushLog(g,ms,"manual");
    toast((ms>0?"Added ":"Removed ") + hm(Math.abs(ms)));
  } else if (act==="delete-yes"){
    delete state.goals[id]; openPanel=null; confirmDelete=null; toast("Goal deleted");
  }
  persist(); render(); wake();
});

/* ---------- goal form ---------- */
function setMode(m){
  formMode = m;
  $("mDown").setAttribute("aria-pressed", m==="down"); $("mUp").setAttribute("aria-pressed", m==="up");
  $("hLabel").textContent = m==="down" ? "Hour budget" : "Target hours (optional)";
}
$("mDown").onclick=()=>setMode("down"); $("mUp").onclick=()=>setMode("up");
$("chips").addEventListener("click",ev=>{
  const b = ev.target.closest("button[data-t]"); if(!b) return;
  const [n,m,h] = b.dataset.t.split("|"); $("fName").value=n; setMode(m); $("fHours").value=h; $("fName").select();
});
function fillFolderSelect(selected){
  const opts = [`<option value="">No folder</option>`]
    .concat(folders().map(f=>`<option value="${f.id}">${esc(f.name)}</option>`))
    .concat([`<option value="__new">+ New folder…</option>`]);
  $("fFolder").innerHTML = opts.join("");
  $("fFolder").value = selected && state.folders[selected] ? selected : "";
  $("fNewFolderWrap").hidden = true; $("fNewFolder").value = "";
}
$("fFolder").onchange=()=>{ const n = $("fFolder").value==="__new"; $("fNewFolderWrap").hidden=!n; if(n) $("fNewFolder").focus(); };
function openForm(id){
  const g = id ? state.goals[id] : null; editingId = id || null;
  closeFolderForm();
  $("formTitle").textContent = g ? "Edit goal" : "New goal";
  $("saveBtn").textContent = g ? "Save changes" : "Save goal";
  $("chips").hidden = !!g;
  $("fName").value = g ? g.name : ""; $("fHours").value = g && g.targetH ? g.targetH : ""; $("fDate").value = g && g.deadline ? g.deadline : "";
  fillFolderSelect(g ? g.folderId : current);
  setMode(g ? g.mode : "down");
  $("form").hidden=false; $("addRow").hidden=true; $("menu").hidden=true;
  $("form").scrollIntoView({behavior:"smooth",block:"start"});
}
function closeForm(){ $("form").hidden=true; $("addRow").hidden=false; editingId=null; }
$("addBtn").onclick=()=>openForm(null); $("cancelBtn").onclick=closeForm;
$("form").addEventListener("submit",ev=>{
  ev.preventDefault();
  const name = $("fName").value.trim(), hrs = parseFloat($("fHours").value);
  if (!name) return toast("Give the goal a name.");
  if (formMode==="down" && !(hrs>0)) return toast("A countdown needs an hour budget.");
  let folderId = $("fFolder").value || null;
  if (folderId==="__new"){
    const fname = $("fNewFolder").value.trim();
    if (!fname) return toast("Name the new folder.");
    folderId = newId("f"); state.folders[folderId] = {name:fname, createdAt:Date.now()};
  }
  const id = editingId || newId("g");
  const base = state.goals[id] || {doneMs:0,runningSince:null,log:[],createdAt:Date.now()};
  state.goals[id] = {...base, name, folderId, mode:formMode, targetH: hrs>0?hrs:null, deadline:$("fDate").value||null};
  const moved = editingId && base.folderId !== folderId;
  if (persist()){
    toast(editingId ? (moved ? "Goal moved" : "Goal updated") : "Goal added");
    closeForm();
    if (!editingId && folderId && folderId!==current) go(folderId); else render();
  }
});

/* ---------- folders ---------- */
function openFolderForm(fid){
  editingFolder = fid || null; closeForm();
  $("folderFormTitle").textContent = fid ? "Rename folder" : "New folder";
  $("folderSave").textContent = fid ? "Save name" : "Create folder";
  $("folderName").value = fid ? state.folders[fid].name : "";
  $("folderDeleteRow").hidden = !fid; $("folderDelete").hidden = false; $("folderDeleteYes").hidden = true; $("folderDeleteNote").hidden = true;
  $("folderForm").hidden = false; $("addRow").hidden = true; $("menu").hidden = true;
  $("folderName").focus();
}
function closeFolderForm(){ $("folderForm").hidden = true; $("addRow").hidden = false; editingFolder = null; }
$("addFolderBtn").onclick=()=>openFolderForm(null);
$("folderEditBtn").onclick=()=>openFolderForm(current);
$("folderCancel").onclick=closeFolderForm;
$("folderSave").onclick=()=>{
  const name = $("folderName").value.trim(); if(!name) return toast("Give the folder a name.");
  if (editingFolder){ state.folders[editingFolder].name = name; persist(); toast("Folder renamed"); closeFolderForm(); render(); }
  else { const id = newId("f"); state.folders[id] = {name, createdAt:Date.now()}; persist(); toast("Folder created"); closeFolderForm(); go(id); }
};
$("folderName").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("folderSave").click(); } });
$("folderDelete").onclick=()=>{ $("folderDelete").hidden=true; $("folderDeleteYes").hidden=false; $("folderDeleteNote").hidden=false; };
$("folderDeleteYes").onclick=()=>{
  const fid = editingFolder;
  Object.values(state.goals).forEach(g=>{ if(g.folderId===fid) g.folderId=null; });
  delete state.folders[fid]; persist(); toast("Folder deleted, goals kept"); closeFolderForm(); go(null);
};
$("backBtn").onclick=()=>{ if (history.length>1 && folderFromHash()) history.back(); else go(null); };

/* ---------- backup ---------- */
$("menuBtn").onclick=()=>{ const m=$("menu"); m.hidden=!m.hidden; $("menuBtn").setAttribute("aria-expanded",!m.hidden); };
$("exportBtn").onclick=()=>{
  const blob = new Blob([JSON.stringify({app:"hour-budget",version:2,exportedAt:new Date().toISOString(),...state},null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "hour-budget-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup saved to your downloads");
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async ev=>{
  const f = ev.target.files[0]; ev.target.value=""; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (!data || typeof data.goals!=="object") throw 0;
    pendingImport = {goals:data.goals, folders:data.folders||{}};
    $("importText").textContent = "This backup has " + Object.keys(data.goals).length + " goals and " + Object.keys(pendingImport.folders).length + " folders. Restoring replaces what's on this phone.";
    $("importConfirm").hidden=false;
  }catch(e){ toast("That file isn't an Hour Budget backup."); }
};
$("importYes").onclick=()=>{ state=pendingImport; pendingImport=null; $("importConfirm").hidden=true; persist(); go(null); render(); toast("Backup restored"); };
$("importNo").onclick=()=>{ pendingImport=null; $("importConfirm").hidden=true; };

/* ---------- install ---------- */
let deferred = null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("installBar").hidden=false; });
$("installBtn").onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred=null; $("installBar").hidden=true; };
window.addEventListener("appinstalled",()=>{ $("installBar").hidden=true; });
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

if (current && !state.folders[current]) current = null;
render(); wake();
})();
</script>
</body>
</html>
